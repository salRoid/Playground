<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="An animated profile card with social links.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/fontawesome.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/brands.min.css" rel="stylesheet">

    <link href="../shared/back.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">

    <title>Profile Card</title>
</head>

<body>
    <a class="pg-back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Playground</a>

    <main>
        <article class="card">
            <img class="avatar" src="img/profile.webp" alt="Sajal Gupta" width="400" height="400">
            <div class="content">
                <h1 class="name">SAJAL GUPTA</h1>
                <div class="rule" aria-hidden="true"></div>
                <nav class="socials" aria-label="Social links">
                    <a href="https://github.com/salroid" aria-label="GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
                    <a href="https://x.com/salRoid" aria-label="X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a>
                    <a href="https://www.linkedin.com/in/salroid" aria-label="LinkedIn"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
                    <a href="https://www.instagram.com/sal_roid" aria-label="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
                    <a href="https://www.youtube.com/@salroid" aria-label="YouTube"><i class="fa-brands fa-youtube" aria-hidden="true"></i></a>
                </nav>
            </div>
        </article>
    </main>
</body>

</html>
